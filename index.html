<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCP</title>
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="icon" href="src/assets/favicon.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="vendor/chart.umd.js"></script>

</head>
<body>
    <img src="src/assets/ucc-logo.png" alt="Logo UCC" class="watermark">
    <h1>Simulador RCP</h1>
    <div id="buttonsContainer">
        <!-- <button id="bluetoothButton">Conectar vía Bluetooth</button> -->
        <button id="serialButton">Conectar Bluetooth</button>
        <button id="simulateButton">Simular Trama</button>
        <button id="saveButton">Terminar</button>
        <button id="resetButton">Reiniciar</button>
    </div>
    <div id="output">
        <!-- <h2>Datos Recibidos:</h2> -->
        <!-- <p id="receivedData">Ningún dato recibido aún</p> -->
    </div>

    <div id="progressContainer" class="progress-container">
    <label>Tiempo de maniobra:</label>
    <div class="progress-background">
        <div id="progressBar" class="progress-bar"></div>
    </div>
    <span id="progressLabel" class="progress-label">0s / 60s</span>

    </div>

    <div class="chart-container">
        <div>
            <canvas id="freqChart" width="300" height="150"></canvas>
        </div>
        <div>
            <canvas id="profChart" width="300" height="150"></canvas>
        </div>
        <div>
            <canvas id="pieChart" width="200" height="200"></canvas>
        </div>
        <div>
            <canvas id="handPosChart" width="200" height="200"></canvas>
        </div>
    </div>

    <script src="src/js/visualizacion.js"></script>
    <script src="src/js/script.js"></script>
</body>
</html>
