<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCP</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="icon" href="estilos/image.png" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="scripts/chart.umd.js"></script>

</head>
<body>
    <img src="estilos/ucc_logo_png_fdb20f633a.png" alt="Marca de agua" class="watermark">
    <h1>Simulador RCP</h1>
    <div id="buttonsContainer">
        <!-- <button id="bluetoothButton">Conectar vía Bluetooth</button> -->
        <button id="serialButton">Conectar Bluetooth</button>
        <button id="simulateButton">Simular Trama</button>
        <button id="saveButton">Terminar</button>
        <button id="resetButton">Reiniciar</button>
    </div>
    <div id="output">
        <!-- <h2>Datos Recibidos:</h2> -->
        <!-- <p id="receivedData">Ningún dato recibido aún</p> -->
    </div>

    <div class="chart-container">
        <div>
            <canvas id="freqChart" width="300" height="150"></canvas>
        </div>
        <div>
            <canvas id="profChart" width="300" height="150"></canvas>
        </div>
        <div>
            <canvas id="pieChart" width="200" height="200"></canvas>
        </div>
        <div>
            <canvas id="handPosChart" width="200" height="200"></canvas>
        </div>
    </div>

    <script src="scripts/visualizacion.js"></script>
    <script src="scripts/script.js"></script>
</body>
</html>
